```yaml
name: Android CI

on:
  push:
    branches: [ "develop" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 📥 Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ Set up Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 🤖 Setup Android SDK (CLI)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 🚫 Remove Google TV add-on (causes license freeze)
      - name: Remove problematic SDK packages
        run: |
          sdkmanager --uninstall "add-ons;addon-googletvaddon-google-13" || true

      # ✅ Force accept all licenses (non-interactive)
      - name: Accept all SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      # 📦 Install ONLY required SDK components
      - name: Install required SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      # 🔧 Create local.properties (important for Gradle)
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 🔧 Make gradlew executable
      - name: Grant execute permission
        run: chmod +x gradlew

      # ⚡ Cache Gradle (speeds up builds)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 🏗️ Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
```

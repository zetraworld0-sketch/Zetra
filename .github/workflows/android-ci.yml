name: Android CI

on:
  push:
    branches: [ "develop" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # 📥 Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # ☕ Java 21 (IMPORTANT — fixes your previous error)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 🤖 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 🚫 Remove problematic Google TV package
      - name: Remove problematic SDK packages
        run: |
          sdkmanager --uninstall "add-ons;addon-googletvaddon-google-13" || true

      # ✅ Accept licenses (force)
      - name: Accept all SDK licenses
        run: yes | sdkmanager --licenses || true

      # 📦 Install required SDK packages
      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0"

      # 🔧 local.properties
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 🔧 Gradle permission
      - name: Grant execute permission
        run: chmod +x gradlew

      # ⚡ Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # 🏗️ Build (FULL ERROR OUTPUT ENABLED)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode all
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

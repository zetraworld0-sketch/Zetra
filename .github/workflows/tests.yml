name: Run Tests

on:
  push:
    branches: [ develop ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Use correct Java version
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ✅ Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ Fix missing SDK path
      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # ✅ Permissions
      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ Clean first (important)
      - name: Clean
        run: ./gradlew clean

      # ✅ Run ONLY unit tests (safe)
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --info

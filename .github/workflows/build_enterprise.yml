name: Enterprise APK Build

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [ develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  build:
    name: Build Enterprise APKs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [debug, release, nightly]
      fail-fast: false

    concurrency:
      group: ${{ github.ref == 'refs/heads/develop' && format('build-develop-enterprise-{0}-{1}', matrix.variant, github.sha) || format('build-enterprise-{0}-{1}', matrix.variant, github.ref)  }}
      cancel-in-progress: true

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      # ❌ REMOVED SSH STEP (this was breaking everything)

      # ❌ REMOVED submodule cloning (not needed)

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble debug APK
        if: ${{ matrix.variant == 'debug' }}
        run: ./gradlew :app:assembleGplayDebug

      - name: Upload debug APK
        if: ${{ matrix.variant == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: zetra-debug
          path: app/build/outputs/apk/gplay/debug/*-debug.apk

      - name: Build release
        if: ${{ matrix.variant == 'release' }}
        run: ./gradlew bundleGplayRelease

      - name: Build nightly
        if: ${{ matrix.variant == 'nightly' }}
        run: ./gradlew compileGplayNightlySources
